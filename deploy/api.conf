# Reverse proxy Nginx para el backend Node/API (puerto 3000).
# Reemplaza TUSUB por tu subdominio de DuckDNS.
#
# Instalar en el SERVIDOR LINUX:
#   sudo cp api.conf /etc/nginx/sites-available/api
#   sudo ln -s /etc/nginx/sites-available/api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Luego Certbot le anade el bloque HTTPS automaticamente (ver README).

server {
    listen 80;
    server_name api.buildwiselabs.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSockets / conexiones persistentes
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cabeceras estandar de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }
}
