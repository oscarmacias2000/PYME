<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot PYME</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    header {
      padding: 14px 20px;
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3a;
      font-size: 1.05rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Burbujas ── */
    .bubble {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 0.93rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.user  { align-self: flex-end; background: #3b82f6; color: #fff; border-bottom-right-radius: 4px; }
    .bubble.bot   { align-self: flex-start; background: #1e2130; border: 1px solid #2a2d3a; border-bottom-left-radius: 4px; }
    .bubble.error { align-self: flex-start; background: #3b1a1a; border: 1px solid #7f1d1d; color: #fca5a5; }
    .bubble.system { align-self: center; background: #1a1d27; border: 1px dashed #2a2d3a; color: #64748b; font-size: 0.82rem; max-width: 90%; text-align: center; padding: 8px 14px; }

    .bubble.bot.typing::after { content: '▌'; animation: blink .7s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Tarjeta de descarga ── */
    .download-card {
      align-self: flex-start;
      background: #0f2a1a;
      border: 1px solid #166534;
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 320px;
    }

    .download-card .icon { font-size: 1.8rem; }

    .download-card .info { flex: 1; }
    .download-card .info strong { display: block; font-size: 0.9rem; color: #86efac; }
    .download-card .info span  { font-size: 0.78rem; color: #4ade80; }

    .download-card a {
      background: #16a34a;
      color: #fff;
      padding: 7px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .download-card a:hover { background: #15803d; }

    /* ── Controles ── */
    #controls {
      padding: 12px 14px;
      background: #1a1d27;
      border-top: 1px solid #2a2d3a;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid #2a2d3a;
      background: #0f1117;
      color: #e8eaf0;
      font-size: 0.93rem;
      resize: none;
      min-height: 46px;
      max-height: 140px;
      outline: none;
      line-height: 1.4;
    }

    #input:focus { border-color: #3b82f6; }
    #input:disabled { opacity: 0.5; }

    button {
      padding: 11px 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: background .15s, transform .1s;
      flex-shrink: 0;
    }

    button:active { transform: scale(.95); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #sendBtn { background: #3b82f6; color: #fff; }
    #sendBtn:hover:not(:disabled) { background: #2563eb; }

    #micBtn, #fileBtn {
      background: #1e2130;
      border: 1px solid #2a2d3a;
      color: #94a3b8;
    }

    #micBtn:hover:not(:disabled), #fileBtn:hover:not(:disabled) { border-color: #3b82f6; color: #e8eaf0; }

    #micBtn.listening {
      background: #7f1d1d;
      border-color: #ef4444;
      color: #fff;
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }

    #voiceStatus {
      font-size: 0.73rem;
      color: #64748b;
      text-align: center;
      padding: 3px 0 0;
      min-height: 16px;
    }

    #fileInput { display: none; }

    /* ── Barra de progreso upload ── */
    #uploadProgress {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #1a1d27;
      border-top: 1px solid #2a2d3a;
      font-size: 0.8rem;
      color: #64748b;
    }

    #uploadProgress.active { display: flex; }

    #progressBar {
      flex: 1;
      height: 4px;
      background: #2a2d3a;
      border-radius: 2px;
      overflow: hidden;
    }

    #progressFill {
      height: 100%;
      background: #3b82f6;
      width: 0%;
      transition: width .3s;
      border-radius: 2px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <span class="dot"></span>
  Asistente de Negocios PYME
</header>

<div id="chat"></div>
<div id="voiceStatus"></div>

<div id="uploadProgress">
  <span id="uploadLabel">Procesando...</span>
  <div id="progressBar"><div id="progressFill"></div></div>
</div>

<div id="controls">
  <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
  <button id="fileBtn" title="Subir Excel">📎</button>
  <textarea id="input" placeholder="Escribe tu mensaje o sube un Excel con 📎" rows="1"></textarea>
  <button id="micBtn" title="Hablar">🎤</button>
  <button id="sendBtn" title="Enviar">➤</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const chat        = document.getElementById('chat');
  const input       = document.getElementById('input');
  const sendBtn     = document.getElementById('sendBtn');
  const micBtn      = document.getElementById('micBtn');
  const fileBtn     = document.getElementById('fileBtn');
  const fileInput   = document.getElementById('fileInput');
  const voiceStatus = document.getElementById('voiceStatus');
  const uploadProg  = document.getElementById('uploadProgress');
  const uploadLabel = document.getElementById('uploadLabel');
  const progressFill = document.getElementById('progressFill');

  let botBubble   = null;
  let isListening = false;
  let recognition = null;
  let lastBotText = '';

  // ─── Mensaje de bienvenida ─────────────────────────────────────────────
  addBubble('¡Hola! Soy tu asistente de negocios. Puedes:\n• Hacerme preguntas por texto o voz 🎤\n• Subir un Excel con datos de combustible/diesel 📎 y lo analizo automáticamente', 'system');

  // ─── Socket events ─────────────────────────────────────────────────────
  socket.on('token', ({ text }) => {
    if (botBubble) { botBubble.textContent += text; lastBotText += text; scrollDown(); }
  });

  socket.on('done', () => {
    if (botBubble) botBubble.classList.remove('typing');
    botBubble = null;
    setEnabled(true);
    speakText(lastBotText);
    lastBotText = '';
  });

  socket.on('error', ({ message }) => {
    if (botBubble) botBubble.remove();
    addBubble(message, 'error');
    botBubble = null;
    setEnabled(true);
  });

  // ─── Enviar texto ──────────────────────────────────────────────────────
  function sendMessage(text) {
    text = (text || input.value).trim();
    if (!text) return;
    addBubble(text, 'user');
    socket.emit('message', { text });
    botBubble = addBubble('', 'bot typing');
    lastBotText = '';
    input.value = '';
    autoResize();
    setEnabled(false);
    scrollDown();
  }

  sendBtn.addEventListener('click', () => sendMessage());
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  input.addEventListener('input', autoResize);

  // ─── Upload Excel ──────────────────────────────────────────────────────
  fileBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    fileInput.value = '';

    addBubble(`📎 Subiendo: ${file.name}`, 'user');
    setEnabled(false);
    showProgress('Leyendo y procesando el archivo...');

    const form = new FormData();
    form.append('file', file);

    try {
      const resp = await fetch('/upload', { method: 'POST', body: form });
      const json = await resp.json();

      hideProgress();

      if (!resp.ok || json.error) {
        addBubble(`Error: ${json.error || 'No se pudo procesar el archivo'}`, 'error');
        setEnabled(true);
        return;
      }

      // Tarjeta de descarga
      addDownloadCard(json.downloadFile, file.name);

      // Pide al bot que analice
      botBubble = addBubble('', 'bot typing');
      lastBotText = '';
      socket.emit('analyze', { data: json.data, filename: file.name });

    } catch (err) {
      hideProgress();
      addBubble(`Error de red: ${err.message}`, 'error');
      setEnabled(true);
    }
  });

  function showProgress(label) {
    uploadLabel.textContent = label;
    progressFill.style.width = '60%';
    uploadProg.classList.add('active');
  }

  function hideProgress() {
    progressFill.style.width = '100%';
    setTimeout(() => { uploadProg.classList.remove('active'); progressFill.style.width = '0%'; }, 400);
  }

  // ─── UI helpers ────────────────────────────────────────────────────────
  function addBubble(text, cls) {
    const div = document.createElement('div');
    div.className = `bubble ${cls}`;
    div.textContent = text;
    chat.appendChild(div);
    scrollDown();
    return div;
  }

  function addDownloadCard(filename, originalName) {
    const card = document.createElement('div');
    card.className = 'download-card';
    card.innerHTML = `
      <div class="icon">📊</div>
      <div class="info">
        <strong>Reporte generado</strong>
        <span>${originalName.replace(/\.[^.]+$/, '')}_resultado.xlsx</span>
      </div>
      <a href="/outputs/${filename}" download>Descargar</a>
    `;
    chat.appendChild(card);
    scrollDown();
  }

  function scrollDown()  { chat.scrollTop = chat.scrollHeight; }

  function setEnabled(val) {
    sendBtn.disabled = !val;
    input.disabled   = !val;
    fileBtn.disabled = !val;
  }

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }

  // ─── Text-to-Speech ────────────────────────────────────────────────────
  function speakText(text) {
    if (!window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.slice(0, 500));
    u.lang = 'es-MX';
    window.speechSynthesis.speak(u);
  }

  // ─── Speech-to-Text ────────────────────────────────────────────────────
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    micBtn.disabled = true;
    micBtn.title = 'Tu navegador no soporta reconocimiento de voz';
  } else {
    recognition = new SpeechRecognition();
    recognition.lang = 'es-MX';
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onstart  = () => { isListening = true;  micBtn.classList.add('listening'); voiceStatus.textContent = '🎙 Escuchando...'; };
    recognition.onend    = () => stopListening();
    recognition.onerror  = e  => { voiceStatus.textContent = `Error: ${e.error}`; stopListening(); };

    recognition.onresult = e => {
      const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
      input.value = transcript;
      autoResize();
      if (e.results[e.results.length - 1].isFinal) {
        voiceStatus.textContent = '';
        stopListening();
        sendMessage(transcript);
      }
    };

    micBtn.addEventListener('click', () => isListening ? recognition.stop() : recognition.start());
  }

  function stopListening() {
    isListening = false;
    micBtn.classList.remove('listening');
    voiceStatus.textContent = '';
  }
</script>
</body>
</html>
