<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistente PYME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg-page:    #0D1117;
      --bg-widget:  #161B22;
      --bg-header:  #1C2128;
      --bg-input:   #0D1117;
      --bg-user:    #1F6FEB;
      --bg-bot:     #1C2128;
      --bg-system:  #161B22;
      --border:     #21262D;
      --accent:     #2EA043;
      --accent-h:   #3FB950;
      --text:       #E6EDF3;
      --text-muted: #7D8590;
      --shadow:     0 8px 32px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
      --radius:     16px;
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg-page:    #F0F2F5;
        --bg-widget:  #FFFFFF;
        --bg-header:  #F6F8FA;
        --bg-input:   #F6F8FA;
        --bg-user:    #1F6FEB;
        --bg-bot:     #F0F2F5;
        --bg-system:  #EAF0FB;
        --border:     #D0D7DE;
        --text:       #1F2328;
        --text-muted: #656D76;
        --shadow:     0 8px 32px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.08);
      }
    }

    :root[data-theme="dark"] {
      --bg-page:    #0D1117;
      --bg-widget:  #161B22;
      --bg-header:  #1C2128;
      --bg-input:   #0D1117;
      --bg-bot:     #1C2128;
      --bg-system:  #161B22;
      --border:     #21262D;
      --text:       #E6EDF3;
      --text-muted: #7D8590;
      --shadow:     0 8px 32px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-page);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ── Widget ── */
    .widget {
      width: 100%;
      max-width: 420px;
      height: min(600px, calc(100dvh - 40px));
      background: var(--bg-widget);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      padding: 14px 18px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2EA043, #1F6FEB);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .header-info { flex: 1; min-width: 0; }
    .header-name {
      font-size: 0.87rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-status {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 1px;
    }
    .dot-green {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .header-actions { display: flex; gap: 6px; }
    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      padding: 5px 8px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: border-color .15s, color .15s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Chat ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Bubbles ── */
    .bubble {
      max-width: 82%;
      padding: 10px 13px;
      border-radius: 14px;
      font-size: 0.855rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--bg-user);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.bot {
      align-self: flex-start;
      background: var(--bg-bot);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .bubble.error {
      align-self: flex-start;
      background: #2D1116;
      border: 1px solid #6E2030;
      color: #FF7B72;
    }
    .bubble.system {
      align-self: center;
      background: var(--bg-system);
      border: 1px dashed var(--border);
      color: var(--text-muted);
      font-size: 0.78rem;
      max-width: 92%;
      text-align: center;
      padding: 7px 12px;
      border-radius: 10px;
    }

    .bubble.bot.typing::after {
      content: '▌';
      animation: blink .7s step-end infinite;
      color: var(--accent);
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Download card ── */
    .download-card {
      align-self: flex-start;
      background: #0D2318;
      border: 1px solid #1A4731;
      border-radius: 12px;
      padding: 10px 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 90%;
    }
    .download-card .icon { font-size: 1.5rem; }
    .download-card .info { flex: 1; min-width: 0; }
    .download-card .info strong { display: block; font-size: 0.82rem; color: #56D364; }
    .download-card .info span  { font-size: 0.73rem; color: #3FB950; }
    .download-card a {
      background: var(--accent);
      color: #fff;
      padding: 5px 11px;
      border-radius: 7px;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .download-card a:hover { background: var(--accent-h); }

    /* ── Voice status ── */
    #voiceStatus {
      font-size: 0.71rem;
      color: var(--text-muted);
      text-align: center;
      padding: 2px 14px 0;
      min-height: 14px;
      flex-shrink: 0;
    }

    /* ── Upload progress ── */
    #uploadProgress {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    #uploadProgress.active { display: flex; }
    #progressBar { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
    #progressFill { height: 100%; background: var(--accent); width: 0%; transition: width .3s; }

    /* ── Controls ── */
    #controls {
      padding: 10px 12px;
      background: var(--bg-header);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 7px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      font-family: inherit;
      font-size: 0.855rem;
      resize: none;
      min-height: 38px;
      max-height: 110px;
      outline: none;
      line-height: 1.4;
      transition: border-color .15s;
    }
    #input::placeholder { color: var(--text-muted); }
    #input:focus { border-color: var(--accent); }
    #input:disabled { opacity: 0.4; }

    .ctrl-btn {
      width: 38px; height: 38px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-input);
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, background .15s, color .15s, transform .1s;
      flex-shrink: 0;
    }
    .ctrl-btn:active { transform: scale(.92); }
    .ctrl-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .ctrl-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }

    #sendBtn {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    #sendBtn:hover:not(:disabled) { background: var(--accent-h); border-color: var(--accent-h); color: #fff; }

    #micBtn.listening {
      background: #3D1520;
      border-color: #E5534B;
      color: #FF7B72;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }

    #fileInput { display: none; }

    /* ── Toast ── */
    #sheetsToast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #0D2318;
      border: 1px solid var(--accent);
      color: #56D364;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.79rem;
      font-weight: 500;
      opacity: 0;
      transition: opacity .25s, transform .25s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }
    #sheetsToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      .bubble.bot.typing::after, #micBtn.listening { animation: none; }
    }
  </style>
</head>
<body>

<div id="sheetsToast">📊 Guardado en Sheets</div>

<div class="widget">
  <header>
    <div class="avatar">🌱</div>
    <div class="header-info">
      <div class="header-name">Asistente de Campo</div>
      <div class="header-status"><span class="dot-green"></span>En línea</div>
    </div>
    <div class="header-actions">
      <a href="/reportes" target="_blank" class="icon-btn">
        <svg xmlns="http://www.w3.org/2000/svg" height="15" viewBox="0 -960 960 960" width="15" fill="currentColor" aria-hidden="true">
          <path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/>
        </svg>
        Reportes
      </a>
    </div>
  </header>

  <div id="chat"></div>
  <div id="voiceStatus"></div>

  <div id="uploadProgress">
    <span id="uploadLabel">Procesando...</span>
    <div id="progressBar"><div id="progressFill"></div></div>
  </div>

  <div id="controls">
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
    <button class="ctrl-btn" id="fileBtn" title="Subir Excel">📎</button>
    <textarea id="input" placeholder="Escribe o habla…" rows="1"></textarea>
    <button class="ctrl-btn" id="micBtn" title="Hablar">🎤</button>
    <button class="ctrl-btn" id="sendBtn" title="Enviar">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M1.5 1.5l13 6.5-13 6.5V9.5l9-1.5-9-1.5V1.5z"/>
      </svg>
    </button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket      = io();
  const chat        = document.getElementById('chat');
  const input       = document.getElementById('input');
  const sendBtn     = document.getElementById('sendBtn');
  const micBtn      = document.getElementById('micBtn');
  const fileBtn     = document.getElementById('fileBtn');
  const fileInput   = document.getElementById('fileInput');
  const voiceStatus = document.getElementById('voiceStatus');
  const uploadProg  = document.getElementById('uploadProgress');
  const uploadLabel = document.getElementById('uploadLabel');
  const progressFill = document.getElementById('progressFill');

  let botBubble   = null;
  let isListening = false;
  let recognition = null;
  let lastBotText = '';

  addBubble('¡Hola! Registra operaciones de campo por voz o texto.\nEjemplo: "poda en huerta Norte, 8 personas, 400 árboles"\nO sube un Excel con datos de combustible 📎', 'system');

  // ─── Socket ──────────────────────────────────────────────────────────────
  socket.on('token', ({ text }) => {
    if (botBubble) { botBubble.textContent += text; lastBotText += text; scrollDown(); }
  });

  socket.on('done', () => {
    if (botBubble) botBubble.classList.remove('typing');
    botBubble = null;
    setEnabled(true);
    speakText(lastBotText);
    lastBotText = '';
  });

  socket.on('saved', ({ confirmacion }) => {
    const toast = document.getElementById('sheetsToast');
    toast.textContent = `📊 ${confirmacion || 'Guardado en Sheets'}`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3500);
  });

  socket.on('error', ({ message }) => {
    if (botBubble) botBubble.remove();
    addBubble(message, 'error');
    botBubble = null;
    setEnabled(true);
  });

  // ─── Enviar ───────────────────────────────────────────────────────────────
  function sendMessage(text) {
    text = (text || input.value).trim();
    if (!text) return;
    addBubble(text, 'user');
    socket.emit('message', { text });
    botBubble = addBubble('', 'bot typing');
    lastBotText = '';
    input.value = '';
    autoResize();
    setEnabled(false);
    scrollDown();
  }

  sendBtn.addEventListener('click', () => sendMessage());
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  input.addEventListener('input', autoResize);

  // ─── Upload ───────────────────────────────────────────────────────────────
  fileBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    fileInput.value = '';
    addBubble(`📎 ${file.name}`, 'user');
    setEnabled(false);
    showProgress('Procesando archivo...');
    const form = new FormData();
    form.append('file', file);
    try {
      const resp = await fetch('/upload', { method: 'POST', body: form });
      const json = await resp.json();
      hideProgress();
      if (!resp.ok || json.error) { addBubble(`Error: ${json.error || 'No se pudo procesar'}`, 'error'); setEnabled(true); return; }
      addDownloadCard(json.downloadFile, file.name);
      botBubble = addBubble('', 'bot typing');
      lastBotText = '';
      socket.emit('analyze', { data: json.data, filename: file.name });
    } catch (err) {
      hideProgress();
      addBubble(`Error de red: ${err.message}`, 'error');
      setEnabled(true);
    }
  });

  function showProgress(label) {
    uploadLabel.textContent = label;
    progressFill.style.width = '60%';
    uploadProg.classList.add('active');
  }
  function hideProgress() {
    progressFill.style.width = '100%';
    setTimeout(() => { uploadProg.classList.remove('active'); progressFill.style.width = '0%'; }, 400);
  }

  // ─── Helpers ──────────────────────────────────────────────────────────────
  function addBubble(text, cls) {
    const div = document.createElement('div');
    div.className = `bubble ${cls}`;
    div.textContent = text;
    chat.appendChild(div);
    scrollDown();
    return div;
  }

  function addDownloadCard(filename, originalName) {
    const card = document.createElement('div');
    card.className = 'download-card';
    card.innerHTML = `
      <div class="icon">📊</div>
      <div class="info">
        <strong>Reporte generado</strong>
        <span>${originalName.replace(/\.[^.]+$/, '')}_resultado.xlsx</span>
      </div>
      <a href="/outputs/${filename}" download>Bajar</a>`;
    chat.appendChild(card);
    scrollDown();
  }

  function scrollDown()  { chat.scrollTop = chat.scrollHeight; }
  function setEnabled(v) { sendBtn.disabled = !v; input.disabled = !v; fileBtn.disabled = !v; }
  function autoResize()  { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 110) + 'px'; }

  // ─── TTS ──────────────────────────────────────────────────────────────────
  function speakText(text) {
    if (!window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.slice(0, 500));
    u.lang = 'es-MX';
    window.speechSynthesis.speak(u);
  }

  // ─── STT ──────────────────────────────────────────────────────────────────
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    micBtn.disabled = true;
    micBtn.title = 'Navegador sin soporte de voz';
  } else {
    recognition = new SpeechRecognition();
    recognition.lang = 'es-MX';
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onstart  = () => { isListening = true;  micBtn.classList.add('listening'); voiceStatus.textContent = '🎙 Escuchando…'; };
    recognition.onend    = () => stopListening();
    recognition.onerror  = e  => { voiceStatus.textContent = `Error: ${e.error}`; stopListening(); };
    recognition.onresult = e  => {
      const t = Array.from(e.results).map(r => r[0].transcript).join('');
      input.value = t; autoResize();
      if (e.results[e.results.length - 1].isFinal) { voiceStatus.textContent = ''; stopListening(); sendMessage(t); }
    };
    micBtn.addEventListener('click', () => isListening ? recognition.stop() : recognition.start());
  }

  function stopListening() { isListening = false; micBtn.classList.remove('listening'); voiceStatus.textContent = ''; }
</script>
</body>
</html>
