<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actividad en vivo - Agro PYME</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; }
</style>
</head>
<body class="bg-stone-50 min-h-screen text-stone-800 pb-16">

<header class="bg-white border-b border-stone-100 px-6 py-4">
  <div class="max-w-xl mx-auto flex items-center justify-between gap-3">
    <a href="/bot-web" class="text-stone-400 hover:text-stone-600 text-sm">← Volver</a>
    <div class="flex items-center gap-2">
      <span class="text-xl">📡</span>
      <span class="font-semibold text-stone-800 tracking-tight">Actividad en vivo</span>
    </div>
  </div>
</header>

<main class="max-w-xl mx-auto px-4 pt-6 space-y-4">
  <section class="bg-white rounded-3xl border border-stone-100 shadow-sm p-5">
    <div class="flex items-center gap-2">
      <span id="puntoEstado" class="w-2.5 h-2.5 rounded-full bg-stone-300"></span>
      <span id="textoEstado" class="text-sm font-medium text-stone-600">Conectando...</span>
    </div>
    <p class="text-xs text-stone-400 mt-2">
      Este es el Paso 1: solo confirma que la conexion en tiempo real funciona.
      Los eventos reales (WhatsApp entrante/saliente, guardados desde la web, llamadas a
      la IA, correos...) se iran conectando en los siguientes pasos.
    </p>
  </section>
</main>

<script src="/socket.io/socket.io.min.js"></script>
<script>
const puntoEstado = document.getElementById('puntoEstado');
const textoEstado = document.getElementById('textoEstado');

const socket = io();

socket.on('connect', () => {
  puntoEstado.className = 'w-2.5 h-2.5 rounded-full bg-green-500';
  textoEstado.textContent = 'Conectado ✓';
});
socket.on('disconnect', () => {
  puntoEstado.className = 'w-2.5 h-2.5 rounded-full bg-red-500';
  textoEstado.textContent = 'Desconectado';
});
socket.on('connect_error', (err) => {
  puntoEstado.className = 'w-2.5 h-2.5 rounded-full bg-amber-500';
  textoEstado.textContent = 'Error de conexion: ' + err.message;
});
</script>
</body>
</html>
